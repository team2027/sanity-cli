name: 2027 eval
on:
  workflow_run:
    workflows: ["Publish Preview Packages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate (uses current head SHA)
        required: true
        type: string

permissions:
  pull-requests: write
  issues: write
  statuses: write
  contents: read

env:
  PROMPT_ID: 1d8004c6-d00c-432e-998b-e868a957807c

jobs:
  eval:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR + SHA
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ inputs.pr }}"
            SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
            MANUAL=1
          else
            PR_NUMBER=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
            SHA="${{ github.event.workflow_run.head_sha }}"
            MANUAL=0
            if [ -z "$PR_NUMBER" ]; then
              PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search "$SHA" --json number,headRefOid \
                --jq ".[] | select(.headRefOid==\"$SHA\") | .number" | head -n1)
            fi
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "::notice::No PR found for SHA $SHA, exiting"
            exit 0
          fi
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "manual=$MANUAL" >> "$GITHUB_OUTPUT"

      - name: Skip if already evaluated (auto only)
        id: gate
        if: steps.ctx.outputs.pr != '' && steps.ctx.outputs.manual == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.ctx.outputs.pr }}
        run: |
          set -euo pipefail
          MARKER="<!-- 2027-eval-comment:${PROMPT_ID} -->"
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
               --jq '.[].body' | grep -qF "$MARKER"; then
            echo "Prior eval comment found for this prompt, skipping auto run"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute cliInstall
        id: cli
        if: steps.ctx.outputs.pr != '' && steps.gate.outputs.skip != '1'
        env:
          SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:7}"
          CLI_URL="https://pkg.pr.new/${GITHUB_REPOSITORY}/@sanity/cli@${SHORT_SHA}"
          echo "install=npm i -g ${CLI_URL}" >> "$GITHUB_OUTPUT"

      - name: Run 2027 eval
        if: steps.ctx.outputs.pr != '' && steps.gate.outputs.skip != '1'
        # Pinned to team2027/evals-action#5 head until template-vars ships in a tag
        uses: team2027/evals-action@e6a0d33b831192586916320664d056066822c747
        with:
          api-key: ${{ secrets.EVALS_API_KEY }}
          prompt-id: ${{ env.PROMPT_ID }}
          template-vars: |
            { "cliInstall": "${{ steps.cli.outputs.install }}" }
