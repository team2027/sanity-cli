name: 2027 eval
on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]

permissions:
  pull-requests: write
  issues: write
  statuses: write
  contents: read

env:
  PROMPT_ID: 1d8004c6-d00c-432e-998b-e868a957807c

jobs:
  eval:
    if: "contains(github.event.pull_request.labels.*.name, 'trigger: preview')"
    runs-on: ubuntu-latest
    steps:
      - name: Debug
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Action: ${{ github.event.action }}"
          echo "Labels: ${{ toJSON(github.event.pull_request.labels.*.name) }}"

      - name: Wait for pkg-pr-new on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            RESULT=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "Publish Preview Packages" \
              --commit "$SHA" \
              --json status,conclusion --limit 5 \
              --jq '[.[] | select(.status=="completed")] | .[0] // {}')
            STATUS=$(echo "$RESULT" | jq -r '.status // empty')
            CONCLUSION=$(echo "$RESULT" | jq -r '.conclusion // empty')
            if [ "$CONCLUSION" = "success" ]; then
              echo "pkg-pr-new succeeded on $SHA"
              exit 0
            fi
            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" != "success" ]; then
              echo "::error::pkg-pr-new finished with conclusion=$CONCLUSION — aborting eval"
              exit 1
            fi
            echo "waiting for pkg-pr-new on $SHA (attempt $i/30)..."
            sleep 20
          done
          echo "::error::Timed out waiting for pkg-pr-new"
          exit 1

      - name: Compute cliInstall
        id: cli
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "install=npm i -g https://pkg.pr.new/${GITHUB_REPOSITORY}/@sanity/cli@${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Run 2027 eval
        # Pinned to team2027/evals-action#5 head until template-vars ships in a tag
        uses: team2027/evals-action@47d8d95db91cdf4f357436b6823e01683194197b
        with:
          api-key: ${{ secrets.EVALS_API_KEY }}
          prompt-id: ${{ env.PROMPT_ID }}
          # Dummy url-map: server still requires non-empty urlMap even when
          # template-vars is set. No-op rewrite of www.sanity.io.
          url-map: |
            { "www.sanity.io": "https://www.sanity.io" }
          template-vars: |
            { "cliInstall": "${{ steps.cli.outputs.install }}" }
          wait-timeout-minutes: 60
